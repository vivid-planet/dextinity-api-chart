{{- $autoItems := dict }}
{{- range $envName, $ref := .Values.onePasswordSecrets }}
  {{- $parsed := include "dextinity-api.opRef.parse" $ref | fromJson }}
  {{- $_ := set $autoItems $parsed.secretName $parsed.itemPath }}
{{- end }}
{{- range $name, $itemPath := $autoItems }}
---
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: {{ $name }}
  labels:
    {{- include "dextinity-api.labels" $ | nindent 4 }}
spec:
  itemPath: {{ $itemPath | quote }}
{{- end }}
