{{- if .Values.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "dextinity-api.fullname" . }}
  labels:
    {{- include "dextinity-api.labels" . | nindent 4 }}
  annotations:
  {{- range $key, $val := .Values.ingress.annotations }}
    {{ $key }}: {{ $val | quote }}
  {{- end }}
spec:
  ingressClassName: nginx
  rules:
  - host: {{ .Values.domain }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: {{ include "dextinity-api.fullname" . }}
            port:
              name: http
  tls:
  - hosts:
    - {{ .Values.domain }}
    secretName: {{ include "dextinity-api.fullname" . }}-cert
{{- end }}
