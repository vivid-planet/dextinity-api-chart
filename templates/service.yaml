apiVersion: v1
kind: Service
metadata:
  name: {{ include "dextinity-api.fullname" . }}
  labels:
    {{- include "dextinity-api.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
{{- if .Values.metrics.enabled }}
    - name: metrics
      protocol: TCP
      port: {{ .Values.metrics.containerPorts.http }}
      targetPort: metrics
{{- end }}
  selector:
    {{- include "dextinity-api.selectorLabels" . | nindent 4 }}
