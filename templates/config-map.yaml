{{- if .Values.env }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "dextinity-api.fullname" . }}
  labels:
    {{- include "dextinity-api.labels" . | nindent 4 }}
data:
  HELM_RELEASE: "{{ .Release.Name }}"
  {{- range $key, $val := .Values.env }}
  {{ $key }}: {{ $val | quote }}
  {{- end }}
{{- end }}
