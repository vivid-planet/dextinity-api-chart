{{- if .Values.image.pullSecret -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dextinity-api.fullname" . }}-image-pull-secret
  labels:
    {{- include "dextinity-api.labels" . | nindent 4 }}
data:
  .dockerconfigjson: {{ required "Missing image.pullSecret" .Values.image.pullSecret }}
type: kubernetes.io/dockerconfigjson
{{- end }}
